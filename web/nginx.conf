server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Ne pas mettre en cache config.json (contient les URLs d'env)
    location = /assets/config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache long pour les assets statiques Angular (hachés)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Landing prérendue (SSG) : HTML statique riche en contenu pour le SEO
    location = / {
        try_files /index.html =404;
    }

    # SPA : pour toutes les autres routes (wizard, admin, paiement…), on sert
    # le shell client (index.csr.html) et non la landing prérendue, pour éviter
    # d'afficher brièvement le contenu de l'accueil avant le routing Angular.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}
