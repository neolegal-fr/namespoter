server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Ne pas mettre en cache config.json (contient les URLs d'env)
    location = /assets/config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache long pour les assets statiques Angular (hachés)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Landing prérendue (SSG) : HTML statique riche en contenu pour le SEO
    location = / {
        try_files /index.html =404;
    }

    # Accueil anglais, prérendu lui aussi.
    location = /en {
        try_files /en/index.html =404;
    }

    # Slash final : UNE seule URL par page.
    #
    # `/en/` et `/guides/` répondaient 200 au même titre que `/en` et
    # `/guides` — deux URL pour une page, que seule la balise canonique
    # rattrapait. Une 301 vers la forme canonique les réunit vraiment. Elle ne
    # touche pas la racine : le motif exige au moins un caractère avant le
    # slash final.
    #
    # `absolute_redirect off` est indispensable : le conteneur écoute en HTTP
    # derrière le nginx de l'hôte, et une redirection absolue partirait donc
    # vers `http://…`, pour être re-redirigée vers HTTPS — une chaîne de deux
    # sauts, dont un en clair. Une Location relative laisse le navigateur
    # conserver le schéma et l'hôte d'origine.
    absolute_redirect off;

    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # Routes : on sert d'abord le fichier exact, puis l'éventuel index.html
    # prérendu de la route (pages de contenu SSG comme /guides/...), à l'URL
    # canonique sans slash final et sans redirection. À défaut, on retombe sur
    # le shell client (index.csr.html) pour les routes purement SPA (wizard,
    # admin, paiement…), sans afficher la landing prérendue au préalable.
    location / {
        try_files $uri $uri/index.html /index.csr.html;
    }
}
