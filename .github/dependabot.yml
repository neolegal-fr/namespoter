version: 2

# Mises à jour de version. Les correctifs de sécurité, eux, sont activés dans
# les réglages GitHub du dépôt et ne dépendent pas de ce fichier.
#
# Parti pris : une PR groupée par écosystème pour les mineures et correctifs,
# et une PR isolée par majeure. Une majeure d'Angular ou de NestJS ne se relit
# pas comme un bump de patch, et noyée dans un lot de vingt elle passerait sans
# être lue.

updates:
  # ─── API (NestJS) ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(api)"
    groups:
      api-mineures:
        patterns: ["*"]
        update-types: [minor, patch]

  # ─── Web (Angular) ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    # Angular se décline en une douzaine de paquets qui doivent monter ensemble.
    # À 5, la limite tronquait le lot et laissait croire que seuls trois d'entre
    # eux étaient en retard — merger l'un d'eux seul désaligne @angular/core.
    open-pull-requests-limit: 12
    commit-message:
      prefix: "chore(web)"
    groups:
      web-mineures:
        patterns: ["*"]
        update-types: [minor, patch]
    # On reste en Angular 21 : passer en 22 impose PrimeNG 22, qui embarque
    # `@primeui/license-manager` et affiche un bandeau dans l'application tant
    # qu'aucune clé n'est fournie. C'est un arbitrage de licence commerciale,
    # pas une montée de dépendance — et sans ces règles, Dependabot rouvre le
    # lot chaque lundi.
    #
    # Seules les MAJEURES sont ignorées : les correctifs de la 21.x continuent
    # d'arriver, et les alertes de sécurité passent outre ces règles.
    #
    # À lever ensemble le jour où la licence PrimeNG est tranchée.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeng"
        update-types: ["version-update:semver-major"]
      # `@primeuix/themes` suit la ligne de PrimeNG, pas la sienne : la 3.x
      # dépend de `@primeuix/styled` ^1, quand PrimeNG 21 embarque ^0.7. Monter
      # le thème seul installe deux copies de `styled` et désaligne les jetons
      # de style des composants. Il montera avec PrimeNG 22, pas avant.
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "keycloak-angular"
        update-types: ["version-update:semver-major"]
      # Angular épingle la version de TypeScript qu'il accepte : ~5.9 en 21,
      # ~6.0 en 22. TypeScript ne monte donc jamais seul.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ─── Images Docker (node:26-alpine, nginx:alpine) ─────────────────────────
  - package-ecosystem: docker
    directories:
      - /api
      - /web
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"

  # ─── Actions GitHub ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
